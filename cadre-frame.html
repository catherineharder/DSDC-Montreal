<script>
/* Cette page est conçue pour vivre dans l'iframe de index.html, qui fournit la
   barre de navigation du site. Atteinte directement en haut de fenêtre
   (résultat de recherche, « Recharger le cadre », signet, ouverture de l'iframe
   dans un nouvel onglet), elle s'affiche seule : plus de nav, aucun moyen de
   revenir aux autres sections. On renvoie alors vers /cadre, qui charge la
   coquille du site avec cette page à l'intérieur.

   Le fichier s'appelle « cadre-frame.html » et non « cadre.html » : GitHub Pages
   sert cadre.html pour l'URL sans extension /cadre, si bien qu'un rechargement
   de /cadre livrait ce document nu — sans nav — au lieu de la coquille, et que
   le garde-fou ci-dessous ne se déclenchait pas (le chemin n'était pas
   « /cadre.html »). Aucun fichier ne porte plus le nom d'un onglet : /cadre
   passe donc par 404.html → index.html comme toutes les autres sections.
   Pas de boucle possible : après la redirection le chemin n'est plus
   « /cadre-frame.html », donc la condition ne se vérifie plus. */
(function () {
  if (window.top !== window.self) return;            // déjà dans le site
  if (!/^https?:$/.test(location.protocol)) return;  // ouverture locale en file://
  if (!/\/cadre-frame\.html$/.test(location.pathname)) return;
  location.replace(
    location.pathname.replace(/\/cadre-frame\.html$/, "/cadre") +
    location.search + location.hash
  );
})();
</script>

:root {

* { box-sizing: border-box; margin: 0; padding: 0; }

/* En-tête de la colonne de gauche (onglets + « Vue d'ensemble » + recherche).
   Il défilait avec le cadre : passé quelques centaines de pixels vers le bas,
   plus aucun moyen de changer d'onglet ni de revenir à la vue d'ensemble. Il
   reste désormais collé en haut. Les marges négatives puis le rembourrage
   redonnent les 24/32px de .left, pour que le contenu passe derrière et non
   à côté. */
.left-header { position: sticky; top: -24px; z-index: 25; background: var(--bg); margin: -24px -32px 18px; padding: 24px 32px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.home-btn { background: none; border: 1px solid var(--border); color: var(--gray); padding: 5px 10px; border-radius: 7px; font-family: inherit; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.home-btn:hover { background: var(--pink-light); color: var(--accent); border-color: var(--pink-medium); }
/* Onglets — même langage visuel que la page Cartes (.map-pick) */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tab { appearance: none; background: transparent; border: 1.5px solid transparent; border-radius: 7px; font: inherit; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); padding: 4px 10px; cursor: pointer; transition: color 120ms ease, border-color 120ms ease; }
.tab:hover { color: #000000; }
.tab[aria-current="page"] { border-color: #000000; color: #000000; }
.tab:focus-visible { outline: 2px solid #000000; outline-offset: 1px; }
/* Cadre simplifié interactif */
.lview[hidden] { display: none; }
.snode { cursor: pointer; }
.snode .box { transition: filter 0.15s ease, stroke 0.15s ease; }
.snode:hover .box { filter: brightness(0.94); }
.snode.active .box { stroke: #000000; stroke-width: 1.75px; }
.ex-item { background: #fff; border-left: 3px solid var(--pink-medium); padding: 9px 13px; margin-bottom: 10px; font-size: 13.5px; line-height: 1.55; border-radius: 0 6px 6px 0; }
.ex-item strong { color: var(--accent); font-weight: 600; }
.theory-link { margin: 14px 0; }
.theory-link button { background: var(--pink-light); border: none; color: var(--accent); padding: 8px 14px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; }
.theory-link button:hover { background: var(--pink-medium); }
.chrono { font-size: 13px; line-height: 1.6; margin: 10px 0 16px; }
.chrono div { padding: 4px 0; border-bottom: 1px solid #000000; }
.chrono b { color: var(--accent); font-weight: 600; }
/* Le cadre est un SVG inséré directement dans la page (bloc CADRE:SVG plus
   bas) et non une image : chaque boîte dessinée dans Illustrator devient donc
   sa propre zone cliquable, au pixel près, cercles et coins arrondis compris.
   tools/build_cadre.py ajoute par-dessus le dessin trois calques de copies :
   #cadre-halo et #cadre-outline (le contour de survol et de sélection, doublé
   d'un liseré blanc pour rester lisible sur les boîtes foncées) et #cadre-hit
   (surface transparente qui reçoit les clics et le focus clavier).
   L'ancienne version posait des rectangles positionnés en pourcentage sur une
   image ; il fallait tous les recalculer dès qu'on retouchait le dessin. */
.svg-wrap { position: relative; width: 100%; max-width: none; margin: 0; }
#cadre-svg { width: 100%; height: auto; display: block; }
#cadre-svg text { user-select: none; }
/* Le fond du dessin reprend celui de la page : aucun liseré entre les deux. */
#cadre-svg #background { fill: var(--bg); }
.cadre-halo, .cadre-outline { fill: none; opacity: 0; pointer-events: none; transition: opacity 0.15s ease; }
.cadre-halo { stroke: #FFFFFF; stroke-width: 4.5px; }
.cadre-outline { stroke: #000000; stroke-width: 2px; }
.cadre-halo.hover, .cadre-outline.hover { opacity: 0.4; }
.cadre-halo.active, .cadre-outline.active { opacity: 1; }
/* fill-opacity plutôt que fill:none : une forme non peinte ne reçoit pas les
   clics. */
.cadre-hit { fill: #000000; fill-opacity: 0; stroke: none; pointer-events: all; cursor: pointer; outline: none; }
.cadre-hit.kb { fill-opacity: 0.05; }
.right { background: #F2EEE4; overflow-y: auto; padding: 40px 48px 80px 48px; }
/* Barre de recherche — même gabarit que celle de Concertations (.conc-search input) */
.search-bar { position: relative; flex: 0 0 auto; width: 230px; max-width: 46vw; margin-left: auto; }

.welcome { color: var(--muted); padding-top: 4px; }

/* Texte assombri : le teal #46747F sur #e7eeef ne donnait que 4,40:1, sous le
   seuil AA de 4,5:1. #33565f sur le même fond : 6,3:1. */

.section-banner { margin-bottom: 22px; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }

.concept-card { margin-bottom: 28px; padding-bottom: 22px; }

.section-label { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
.connexes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }

.example { background: #fff; border-left: 3px solid var(--accent); padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; color: var(--text); line-height: 1.55; border-radius: 0 6px 6px 0; white-space: pre-line; }

.example.inspirant { border-left-color: var(--pink-dark); }

.extra-block { background: var(--pink-light); border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.55; white-space: pre-line; }
.extra-block .label { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 4px; }

.related-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

a { color: var(--accent); }

.split-handle::after { content: ""; position: absolute; inset: 0 4px; border-radius: 3px; background: transparent; transition: background 120ms ease; }
.split-handle:hover::after, .split-handle.dragging::after { background: rgba(70, 116, 127, 0.45); }
@media (max-width: 1000px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .left { border-right: none; border-bottom: 1px solid var(--border); }
  .right { padding: 32px 24px 60px 24px; }
  .split-handle { display: none; }

<script>
/* DATA : une fiche par boîte, clé = identifiant de la boîte.
   ZONEMAP : la même clé -> { section }, pour la recherche. */
const DATA = window.CADRE_DATA || {};
const ZONEMAP = window.CADRE_MAP || {};

const svgwrap = document.getElementById('svgwrap');
const contentEl = document.getElementById('content');
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchResults');
const homeBtn = document.getElementById('homeBtn');

/* Les zones cliquables sont déjà dans le SVG (calque #cadre-hit, posé par
   tools/build_cadre.py). On leur branche ici le clic, le survol et le clavier.
   Une boîte présente dans le dessin mais absente de cadre.data.js reste
   cliquable : elle affichera « Fiche à compléter ». */
const marksOf = key => svgwrap.querySelectorAll('.cadre-halo[data-key="' + CSS.escape(key) + '"], .cadre-outline[data-key="' + CSS.escape(key) + '"]');
const setMark = (key, cls, on) => marksOf(key).forEach(m => m.classList.toggle(cls, on));

svgwrap.querySelectorAll('.cadre-hit').forEach(hit => {
  const key = hit.dataset.key;
  const label = (DATA[key] && DATA[key].title) || (hit.querySelector('title') || {}).textContent || key;
  hit.setAttribute('aria-label', label);
  hit.addEventListener('click', () => selectZone(key));
  hit.addEventListener('mouseenter', () => setMark(key, 'hover', true));
  hit.addEventListener('mouseleave', () => setMark(key, 'hover', false));
  hit.addEventListener('focus', () => { hit.classList.add('kb'); setMark(key, 'hover', true); });
  hit.addEventListener('blur', () => { hit.classList.remove('kb'); setMark(key, 'hover', false); });
  hit.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectZone(key); }
  });
});

function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function linkify(s) {
  return esc(s).replace(/(https?:\/\/[^\s)\]]+|www\.[^\s)\]]+)/g, u => {
    const href = u.startsWith('http') ? u : 'https://' + u;
    return `<a href="${href}" target="_blank" rel="noopener">${u}</a>`;
  });
}

function termCard(slug) {
  const c = DATA[slug];
  const parts = [];
  if (c.definition) parts.push(`<div class="section-label">Définition</div><div class="definition">${linkify(c.definition)}</div>`);
  (c.images || []).forEach(im => {
    parts.push(`<div class="concept-image"><img src="${im.file}" alt="${esc(c.title)}" onerror="this.parentElement.style.display='none'">${im.caption ? `<div class="caption">${esc(im.caption)}</div>` : ''}</div>`);
  });
  if (c.connexes && c.connexes.length) parts.push(`<div class="section-label">Termes connexes</div><div class="connexes">${c.connexes.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>`);
  if (c.exMtl) parts.push(`<div class="example"><div class="label">Exemple à Montréal</div><div>${linkify(c.exMtl)}</div></div>`);
  if (c.exInsp) parts.push(`<div class="example inspirant"><div class="label">Exemple inspirant</div><div>${linkify(c.exInsp)}</div></div>`);
  if (c.extra) parts.push(`<div class="extra-block"><div class="label">Pour aller plus loin</div>${linkify(c.extra)}</div>`);
  if (c.related && c.related.length) {
    const rel = c.related.filter(z => DATA[z]).map(z => `<button onclick="selectZone('${z}')">${esc(DATA[z].title)}</button>`).join('');
    if (rel) parts.push(`<div class="section-label">Explorer</div><div class="related-links">${rel}</div>`);
  }
  if (c.source) parts.push(`<div class="source">Source. ${linkify(c.source)}</div>`);
  if (!parts.length) parts.push(`<div class="empty-note">Fiche à compléter — aucun contenu pour l'instant.</div>`);
  return `<div class="concept-card">${parts.join('')}</div>`;
}

function selectZone(id, fromSearch) {
  const c = DATA[id];
  if (!c) return;
  svgwrap.querySelectorAll('.cadre-halo, .cadre-outline').forEach(o => o.classList.toggle('active', o.dataset.key === id));
  contentEl.innerHTML = `<div class="section-banner"><h1>${esc(c.title)}</h1></div>${termCard(id)}`;
  document.querySelector('.right').scrollTop = 0;
  searchResults.classList.remove('open');
  if (!fromSearch) searchInput.value = '';
}
window.selectZone = selectZone;

function goHome() {
  svgwrap.querySelectorAll('.cadre-halo, .cadre-outline').forEach(o => o.classList.remove('active'));
  const n = svgwrap.querySelectorAll('.cadre-hit').length;
  contentEl.innerHTML = `<div class="welcome">
    <h1>Cadre conceptuel DSDC</h1>
    <p>Cliquez sur une section du cadre à gauche pour explorer les définitions, les termes connexes, les exemples montréalais et les exemples inspirants.</p>
    <p>Utilisez la barre de recherche pour accéder directement à un concept par son nom.</p>
    <span class="hint">${n} concepts cliquables</span></div>`;
  document.querySelector('.right').scrollTop = 0;
}
homeBtn.addEventListener('click', goHome);
goHome();

searchInput.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('open'); return; }
  const matches = [];
  (window.CADRE_ORDER || Object.keys(DATA)).forEach(z => {
    const c = DATA[z];
    if (!c) return;
    const section = (ZONEMAP[z] && ZONEMAP[z].section) || '';
    if (c.title.toLowerCase().includes(q) || (c.connexes || []).some(t => t.toLowerCase().includes(q)) || section.toLowerCase().includes(q)) matches.push([z, c.title, section]);
  });
  if (!matches.length) { searchResults.innerHTML = '<div class="item">Aucun résultat</div>'; }
  else {
    searchResults.innerHTML = matches.slice(0, 20).map(([z, t, g]) => `<div class="item" data-zone="${z}">${esc(t)} <span style="color:#000000;font-size:11px;margin-left:6px">${esc(g)}</span></div>`).join('');
  }
  searchResults.classList.add('open');
});
searchResults.addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (item && item.dataset.zone) selectZone(item.dataset.zone, true);
});
document.addEventListener('click', e => {
  if (!e.target.closest('.search-bar')) searchResults.classList.remove('open');
});

function simpleSVG(tab) {
  const W = 1040, X = 70, RW = 900, CH = 46, INK = '#000000';
  let y = 118, out = [];
  DSL_ROWS.forEach(row => {
    if (row.lab) { out.push(`<text x="${W/2}" y="${y+24}" text-anchor="middle" font-size="16.5" fill="#000000">${row.lab}</text>`); y += 40; }
    else { y += 6; }
    const n = row.chips.length, gap = 6, cw = (RW - gap*(n-1))/n;
    row.chips.forEach((ch, i) => {
      const x = X + i*(cw+gap), fill = ch[2] || row.c;
      out.push(`<g class="snode" data-node="${ch[0]}"><rect class="box" x="${x.toFixed(1)}" y="${y}" width="${cw.toFixed(1)}" height="${CH}" rx="${CH/2}" fill="${fill}"/>` +
        `<text x="${(x+cw/2).toFixed(1)}" y="${y+CH/2+5.5}" text-anchor="middle" font-size="${row.fs}" font-weight="700" letter-spacing=".04em" fill="${INK}">${ch[1]}</text></g>`);
    });
    y += CH;
  });
  y += 30;
  return `<svg viewBox="0 0 ${W} ${y}" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;font-family:inherit" role="group" aria-label="Cadre conceptuel du développement social local">` +
    `<text x="${W/2}" y="58" text-anchor="middle" font-size="27" font-weight="800" fill="${INK}">CADRE CONCEPTUEL DU DÉVELOPPEMENT SOCIAL LOCAL (DSL)</text>` +
    out.join('') + `</svg>`;
}

/* ---- Rendu des onglets exemples ---- */
let activeTab = 'cadre';
let activeNode = { verdun: null, cdn: null };

function renderExHome(tab) {
  const ex = EX[tab];
  const chrono = ex.chrono.map(([d, e]) => `<div><b>${d}</b> — ${esc(e)}</div>`).join('');
  const srcs = ex.srcs.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join(' · ');
  contentEl.innerHTML = `<div class="section-banner"><h1>${esc(ex.title)}</h1></div>
    <div class="concept-card"><div class="definition">${esc(ex.intro)}</div>
    <div class="section-label">Chronologie</div><div class="chrono">${chrono}</div>
    <div class="extra-block"><div class="label">Comment lire cet onglet</div>Cliquez sur un concept du cadre simplifié à gauche pour voir comment ce projet l'illustre concrètement — avec les lois, budgets, instances et acteurs en jeu.</div>
    <div class="source">Sources principales. ${srcs}</div></div>`;
  document.querySelector('.right').scrollTop = 0;
}

function renderExNode(tab, node) {
  const ex = EX[tab]; const d = ex.nodes[node];
  if (!d) return;
  activeNode[tab] = node;
  const lv = document.getElementById('lv-' + tab);
  lv.querySelectorAll('.snode').forEach(g => g.classList.toggle('active', g.dataset.node === node));
  const items = d.items.map(i => `<div class="ex-item">${i}</div>`).join('');
  const src = (d.src && d.src.length) ? `<div class="source">Sources. ${d.src.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(l)}</a>`).join(' · ')}</div>` : '';
  const zone = NODE_TO_ZONE[node];
  const theory = zone && DATA[zone] ? `<div class="theory-link"><button onclick="openTheory('${zone}')">Voir la fiche théorique : ${esc(DATA[zone].title)}</button></div>` : '';
  const title = NODE_TITLES[node];
  contentEl.innerHTML = `<div class="section-banner"><h1>${esc(title)}</h1></div>
    <div class="concept-card"><div class="definition">${esc(d.how)}</div>${items}${theory}${src}</div>`;
  document.querySelector('.right').scrollTop = 0;
}

function openTheory(zone) { setTab('cadre'); selectZone(zone); }
window.openTheory = openTheory;

const ALL_TABS = ['cadre', 'verdun', 'cdn'];
function setTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  ALL_TABS.forEach(t => { document.getElementById('lv-' + t).hidden = (t !== tab); });
  if (tab === 'cadre') { goHome(); }
  else if (tab === 'verdun' || tab === 'cdn') { activeNode[tab] ? renderExNode(tab, activeNode[tab]) : renderExHome(tab); }
}

['verdun', 'cdn'].forEach(tab => {
  const lv = document.getElementById('lv-' + tab);
  lv.innerHTML = simpleSVG(tab);
  lv.addEventListener('click', e => {
    const g = e.target.closest('.snode');
    if (g) renderExNode(tab, g.dataset.node);
  });
});


document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

homeBtn.addEventListener('click', () => {
  if (activeTab === 'verdun' || activeTab === 'cdn') { activeNode[activeTab] = null; document.getElementById('lv-' + activeTab).querySelectorAll('.snode').forEach(g => g.classList.remove('active')); renderExHome(activeTab); }
});

/* Recherche : depuis un onglet exemple, ramène vers le concept (dans l'exemple si possible, sinon dans le cadre complet) */
const ZONE_TO_NODE = {};
Object.entries(NODE_TO_ZONE).forEach(([n, z]) => { ZONE_TO_NODE[z] = n; });
/* La sécurité alimentaire et le logement ne sont plus des boîtes distinctes :
   elles figurent dans « Impact collectif sur les priorités locales ». */
searchResults.addEventListener('click', e => {
  const item = e.target.closest('.item');
  if (!item || !item.dataset.zone) return;
  const z = item.dataset.zone;
  if (activeTab !== 'cadre') {
    const n = ZONE_TO_NODE[z];
    if (n) {
      e.stopImmediatePropagation(); renderExNode(activeTab, n);
      searchResults.classList.remove('open'); searchInput.value = '';
      return;
    }
    e.stopImmediatePropagation(); setTab('cadre'); selectZone(z, true);
    searchResults.classList.remove('open'); searchInput.value = '';
  }
}, true);

/* ---- Barre coulissante gauche/droite (redimensionnable, mémorisée) ---- */
(function () {
  const grid = document.querySelector('.app');
  if (!grid || grid.querySelector('.split-handle')) return;
  const handle = document.createElement('div');
  handle.className = 'split-handle';
  handle.title = 'Glisser pour redimensionner';
  handle.setAttribute('role', 'separator');
  handle.setAttribute('aria-orientation', 'vertical');
  grid.appendChild(handle);
  const KEY = 'cadreSplit';
  const place = (p) => {
    grid.style.gridTemplateColumns = 'minmax(0,' + p + 'fr) minmax(0,' + (100 - p) + 'fr)';
    handle.style.left = p + '%';
  };
  let saved = null;
  try { saved = parseFloat(localStorage.getItem(KEY)); } catch (_) { /* stockage indisponible */ }
  place(saved && saved >= 35 && saved <= 85 ? saved : 60.8);
  let dragging = false;
  handle.addEventListener('pointerdown', (e) => {
    dragging = true; handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId); document.body.style.userSelect = 'none';
  });
  handle.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const r = grid.getBoundingClientRect();
    const p = Math.max(35, Math.min(85, 100 * (e.clientX - r.left) / r.width));
    place(p);
    try { localStorage.setItem(KEY, p.toFixed(1)); } catch (_) { /* ignoré */ }
  });
  const stop = () => { dragging = false; handle.classList.remove('dragging'); document.body.style.userSelect = ''; };
  handle.addEventListener('pointerup', stop);
  handle.addEventListener('pointercancel', stop);
})();
</script>
